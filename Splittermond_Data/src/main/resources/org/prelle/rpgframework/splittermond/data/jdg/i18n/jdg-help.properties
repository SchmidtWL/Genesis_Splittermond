mastership.arcanelore.orientOtherworld1.desc=Der Abenteurer findet sich in der Welt der Feen besser zurecht als normale Sterbliche. Er erhält einen Bonus in Höhe von 3 Punkten auf Proben zur Wildnisführung in den Feenwelten.
mastership.arcanelore.fairylore1.desc= Der Abenteurer kennt sich gut mit Feenwesen aus. Er erhält einen Bonus in Höhe von 2 Punkten auf Entschlossenheit, Wahrnehmung und Zähigkeit im Umgang mit Wesen des Typus Feenwesen oder Feenwerk.
mastership.arcanelore.orientOtherworld2.desc=Der Bonus aus Anderswelt-Orientierung I erhöht sich auf 6 Punkte.
mastership.arcanelore.fairylore2.desc=Der Bonus aus Feenkunde I erhöht sich auf 4 Punkte.
mastership.arcanelore.senseattribute.desc=Der Abenteurer kann nach einem Aufenthalt von mindestens 10 Minuten mit einer einmalig erlaubten gelungenen Arkane Kunde-Probe gegen 30 ein Merkmal der Feenwelt bestimmen, in der er sich aktuell befindet.
mastership.diplomacy.fairytongue.desc=Der Abenteurer weiß, wie er mit Feenwesen umgehen muss. Die Einstellung von Wesen des Typus Feenwesen gegenüber dem Abenteurer ist stets eine Stufe besser, als es sonst der Fall wäre (bis maximal hilfsbereit).
mastership.empathy.fairysense1.desc=Der Abenteurer hat ein Gespür für die Stimmung von Feenwesen. Er erhält einen Bonus in Höhe von 2 Punkten auf Empathie, Diplomatie und Redegewandtheit im Umgang mit Wesen des Typus Feenwesen oder Feenwerk.
mastership.empathy.fairysense2.desc= Der Bonus aus Feengespür I erhöht sich auf 4 Punkte.
mastership.craftmanship.fairycrafter.desc=Wenn der Handwerker feeisches Material bei der Herstellung verwendet (oder solche Gegenstände repariert), zählt dies bei der Probe als stark positiver Umstand.
mastership.perception.senseveil.desc= Der Abenteurer hat einen Blick für die subtilen Unterschiede zwischen Diesseits und Jenseits. Sofern dem Abenteurer eine Probe zustände, um einen Übergang in die Feenwelt, eine feeische Illusion oder Glimmer zu durchschauen, erhält er auf die entsprechende Probe einen Bonus in Höhe von 3 Punkten.
mastership.perception.veilview.desc=Der Abenteurer ist in der Lage, hinter die Maske eines abgelenkten Wesens des Typus Feenwesen zu blicken. Dies erfordert eine kontinuierliche Aktion von 5 Ticks Dauer und eine Wahrnehmung-Probe gegen den Geistigen Widerstand des Feenwesens. Die Probe erhält einen Malus in Höhe der doppelten Stufe des Glimmers (siehe S. 13), in der Feenwelt außerdem zusätzlich einen Malus in Höhe der doppelten Fremdartigkeit (siehe S. 38). Die Stärke Feensinn gewährt einen Bonus in Höhe von 6 Punkten. Bei Gelingen erhält der Betrachter einen kurzen Blick auf das wahre Aussehen des Feenwesens. Dadurch ist er in der Lage, sich auf das Wesen einzustimmen, sodass dieses einen Malus in Höhe von 1 Punkt (+ 1 pro Erfolgsgrad) auf seine nächste Aktion gegen den Betrachter erhält. Die Probe kann erst wiederholt werden, wenn ein eventueller vorheriger Malus angewendet wurde. Ein herausragender Erfolg erlaubt dem Beobachter zudem, eine Vision des eigentlichen Wesenskerns der Fee zu erhaschen, wodurch er unter anderem erfährt, welche Auswirkungen ein Glimmerbruch bei ihr hätte. Je nach Spielleiterentscheid kann er auch weitere Informationen, zum Beispiel über die Motivationen und Ziele der Fee oder, so vorhanden, über deren Wahren Namen erhalten.
mastership.motionmagic.fastotherworld.desc=Die Geschwindigkeit des Abenteurers erhöht sich um 2 Punkte, sofern er sich in der Anderswelt befindet.
mastership.illusionmagic.fairysignature.desc=Sollte der Versuch unternommen werden, Illusionszauber des Abenteurers zu identifizieren, sind mindestens 2 EG nötig, um eindeutig sagen zu können, dass es sich nicht um feeische Magie handelt.
mastership.combatmagic.fairyfoe1.desc=Der Abenteurer hat gelernt, Feenwesen besonders gut zu bekämpfen. Er erhält auf alle gegen einen Widerstandswert gerichteten Zauber einen Bonus in Höhe von 2 Punkten, wenn er diesen gegen ein Wesen des Typus Feenwesen einsetzt.
mastership.combatmagic.fairyfoe2.desc= Alle Zauber des Abenteurers, die Schaden verursachen, verursachen an Wesen des Typus Feenwesen 2 zusätzliche Punkte Schaden.

spell.banishfairies.descr=Der Zauberer erschafft einen Schutzkreis von 3 Metern Radius. Wesen des Typus Feenwesen können den Kreis nur betreten, wenn ihnen eine Probe auf Entschlossenheit gegen 25 gelingt. Sie können aber mit Fernwaffen oder Zaubern in den Kreis einwirken. Wesen des Typus Feenwesen, die sich bei Auslösen des Zaubers in 3 Metern Umkreis um den Zauberer be\uFB01nden, werden bei Misslingen der Probe vom Zauber nach außen gedrängt.
spell.banishfairies.enhancedescr= Die Schwierigkeit für die Entschlossenheit-Probe erhöht sich auf 30.
spell.fairysight.descr=Wenn der Zauberer mit der Meisterschaft Blick hinter die Maske einen Glimmer erfolgreich durchschaut, erhält er automatisch einen zusätzlichen Erfolgsgrad. Außerdem erhält er einen Bonus in Höhe von 2 Punkten auf Proben, um sich in der Feenwelt zu orientieren und um dünne Stellen zur Magischen Domäne zu finden.
spell.fairysight.enhancedescr=Der Bonus erhöht sich auf 4 Punkte.
spell.protectfairies.descr=Der Zauberer erhält einen Bonus in Höhe von jeweils 2 Punkten auf seine Widerstandswerte gegen Wesen des Typus Feenwesen.
spell.protectfairies.enhancedescr=Der Bonus erhöht sich auf 3 Punkte.

power.floatingform.desc=Der Abenteurer besitzt durch das Erbe trickreicher Feen ein geringes natürliches Talent für Glimmer in sich. Er kann minimale Veränderungen an seiner Erscheinung vornehmen, wodurch er den negativen Umstand für improvisierte Verkleidung ignorieren kann.\nSollte er zudem die Meisterschaft Improvisierte Verkleidung (Splittermond: Die Regeln S. 126) beherrschen, erhält er sogar einen leicht positiven Umstand.
power.childblood.desc=Der Abenteurer trägt das Erbe eines Blutwesens in sich. Bei einem etwaigen Zustand Blutend werden in jedem Intervall stets 3 Punkte Schaden ignoriert (der Zustand hält aber an und interagiert wie üblich mit anderen Regelelementen, lediglich der resultierende Schaden wird ignoriert).
power.childstone.desc=Der Abenteurer trägt das Erbe eines Felswesens in sich. Er erhält gegen Angriffe, die seine Position verändern (ihn also z.B. Niederwerfen) einen Bonus in Höhe von 3 Punkten auf seinen Körperlichen Widerstand.
power.childfire.desc=Der Abenteurer trägt das Erbe eines Feuerwesens in sich. Bei einem etwaig vorliegenden Zustand Brennend wird in jedem Intervall stets der höchste Schadenswürfel ignoriert (der Zustand hält aber an und interagiert wie üblich mit anderen Regelelementen, lediglich der resultierende Schaden wird ignoriert).
power.childlight.desc=Der Abenteurer trägt das Erbe eines Lichtwesens in sich. In 5 Meter Umkreis um ihn sind die Lichtverhältnisse stets um 1 Stufe verbessert. Dies kann durch eine Willensanstrengung unterdrückt werden, hierfür muss dann aber ein Malus in Höhe von 1 Punkt auf alle Proben in Kauf genommen werden.
power.childnature.desc=Der Abenteurer trägt das Erbe eines Naturwesens in sich. Bei der Regeneration von verlorenen Lebenspunkten während einer Ruhephase erhält er einen Bonus in Höhe seiner Ausstrahlung.
power.childshadow.desc=Der Abenteurer trägt das Erbe eines Schattenwesens in sich. Die Lichtverhältnisse gelten für ihn als um 1 Stufe verbessert. Außerdem erhält er einen Bonus in Höhe von 1 Punkt auf alle Heimlichkeit-Proben.
power.childwater.desc=Der Abenteurer trägt das Erbe eines Wasserwesens in sich. Er kann alle negativen Umstände beim Schwimmen ignorieren.\nAußerdem bringt ihm jeder Fortschrittspunkt beim Tauchen 1 weiteren zusätzlichen Meter Tauchstrecke und er kann die Luft pro Punkt Konstitution 15 Sekunden länger anhalten als für ihn üblich.
power.childwind.desc=Der Abenteurer trägt das Erbe eines Windwesens in sich. Fallschaden, den der Abenteurer erleidet, gilt immer als um zwei Stufen gesenkt.

item.sedatives.desc=Heilt Zustand Angsterfüllt.
item.sedativesStrong.desc=Heilt Zustand Panisch.
item.blurredVision.desc=Wie Stärke Feensinn für 1 Tag, allerdings nur 2 Punkte Bonus auf Proben, 1 Punkt Bonus auf GW.
item.tatzenbur.desc=Der Tatzenbur ist ein seltener Pilz, dessen Hauptverbreitungsgebiet das Kaiserreich Selenia ist. Er gilt dort als Delikatesse, auch, wenn er schnell auf den Magen schlägt. Vor allem sollte man aber nicht zu viel davon essen, da er angeblich dazu in der Lage ist, den Blick in die Feenwelten zu ermöglichen - aber auch immer wieder Genießer dort verschwinden lässt.
item.rylia.desc=Der Genuss von Rylia verleiht dem Anwender für einen Tag die Stärke Feensinn, allerdings nur mit einem Bonus in Höhe von 2 Punkten auf Proben und einem Bonus in Höhe von 1 Punkt auf den Geistigen Widerstand. 

material.basiliskLeather.desc=Lederrüstungen aus Basiliskleder erhalten KW +2 gegen Gifte und Verwandlungen
material.basiliskLeather.effect=KW +2 gegen Gifte und Verwandlungen
material.dragonSnakeScales.desc=Schuppenrüstungen aus Drachenschlangenschuppen reduzieren Fallschaden um 1 Stufe
material.dragonSnakeScales.effect=Fallschaden -1 Stufe
material.fairyhorseLeather.desc=Aus Feenpferdeleder gefertigte Kleidung besitzt keine besonderen Materialeigenschaften
material.fairyhorseLeather.effect=-
material.kelpieLeather.desc=Seile und Wildfallen aus Kelpieleder gewähren Jagdkunst +2 beim Fallenstellen
material.kelpieLeather.effect=Jagdkunst +2 bei Fallenstellen
material.dragonflySnakeLeather.desc=Aus Libellenschlangenleder gefertigte Gegenstände gewähren Illusionsmagie +1; alle Illusionen sind um 2 Punkte schwerer zu durchschauen
material.dragonflySnakeLeather.effect=Illusionsmagie +1, alle Illusionen um 2 Punkte schwerer zu durchschauen
material.mardxarFur.desc=Kleidung aus Mardxarfell erhält KW +1 gegen Gifte
material.mardxarFur.effect=KW +1 gegen Gifte
material.mardxarWingLeather.desc=Lederrüstungen aus Mardxarflügelleder erhalten KW +1 gegen positionsverändernde Angriffe
material.mardxarWingLeather.effect=KW +1 gegen positionsverändernde Angriffe
material.sphynxFeathers.desc=Schmuck aus Sphynxfedern gewährt Arkane Kunde +2 bei Identifizierung und Analyse von Artefakten.
material.sphynxFeathers.effect=Arkane Kunde +2 bei Identifizierung und Analyse von Artefakten